image boot.vfat {
	vfat {
		label = "RGBOOT"
		files = {
			"Image",
			"sun50i-h700-anbernic-rg35xx-sp.dtb"
		}
		file extlinux/extlinux.conf {
			image = "extlinux.conf"
		}
	}
	size = 128M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		# Root is found through this: PARTUUID=52473335-02
		disk-signature = 0x52473335
	}

	# The H700 boot ROM looks for the bootloader at 8 KiB
	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}

	partition boot {
		partition-type = 0x0C
		bootable = true
		offset = 1M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
