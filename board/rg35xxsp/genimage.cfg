# The card's layout. TETSU-DATA, at 4 GiB, isn't in the image: flash.sh adds it after
# writing the image (scripts/data-partition.sh), as partition 4, keeping its contents.
#
#   8 KiB    U-Boot, outside the partition table
#   1 MiB    1 TETSU-BOOT  FAT: logs, which a PC can read
#   129 MiB  2 TETSU-ROOT  root slot A, with the kernel in /boot (bootable flag)
#   1153 MiB 3             root slot B, empty, kept for A/B updates
#   4 GiB    4 TETSU-DATA  games and saves (not in the image)
#
# U-Boot boots the partition with the bootable flag, from its /boot/extlinux/extlinux.conf.

image boot.vfat {
	vfat {
		label = "TETSU-BOOT"
		# Without a list, genimage would copy the whole root filesystem here
		files = { "README.txt" }
	}
	size = 128M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		# "TETS". Root is found through this: PARTUUID=54455453-02
		disk-signature = 0x54455453
	}

	# The H700 boot ROM looks for the bootloader at 8 KiB
	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}

	partition boot {
		partition-type = 0x0C
		offset = 1M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		bootable = true
		image = "rootfs.ext4"
		size = 1G
	}

	# No file system yet; flash.sh doesn't write this area
	partition rootfs-b {
		partition-type = 0x83
		size = 1G
	}
}
