[package]
name = "launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Game launcher and libretro frontend for the RG35XX SP"

[dependencies]
crc32fast = "1.5.4"
evdev = "0.13.2"
flate2 = "1.1.11"
jiff = { version = "0.2.40", default-features = false, features = ["std"] }
libc = "0.2.191"
libloading = "0.9.0"
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tiny_http = "0.12.0"
ureq = "3.5.1"
zbus = "5.13.2"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
cc = "1.2.56"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[dev-dependencies]
jiff = { version = "0.2.40", default-features = false, features = ["std", "tzdb-bundle-always"] }

# The bar the code is kept to: `cargo clippy --all-targets` is clean with this.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pixel, sample and layout arithmetic, where the ranges are known.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The frame loop, and the flat matches over every action and environment command.
too_many_lines = "allow"
# Fixes that read worse here.
format_collect = "allow"
format_push_string = "allow"
if_not_else = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
single_match_else = "allow"
unreadable_literal = "allow"
# Names and signatures kept as they are.
needless_pass_by_value = "allow"
option_option = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
trivially_copy_pass_by_ref = "allow"
unused_self = "allow"
# A file name in a warning stays quoted; the others are only in tests.
unnecessary_debug_formatting = "allow"
float_cmp = "allow"
unchecked_time_subtraction = "allow"
