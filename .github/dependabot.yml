# Weekly update pull requests for the launcher's crates, the docs site's npm packages and
# the workflows' actions. Buildroot, the kernel, U-Boot and the emulator cores are pinned
# in configs/ and package/, which Dependabot doesn't read: update those by hand.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src/launcher
    schedule:
      interval: weekly
    groups:
      crates:
        update-types: [minor, patch]
    ignore:
      # zbus 6 removed the blocking API that bluetooth/mod.rs and device/audio_out.rs use.
      # Moving to it means async D-Bus code and Bluetooth tested again on the device.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
