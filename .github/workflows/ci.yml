# Builds and tests the launcher on the PC for every pull request and push to main, the
# check that gates Dependabot's updates and everyone's changes. The device image itself is
# built by release.yml; hardware behaviour still needs a real device.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/launcher
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        # Stable, so new clippy lints show here before they reach a PC
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/launcher/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src/launcher/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
